{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>任务列表</h2>
  {% if jobs %}
  <table>
    <thead><tr><th>ID</th><th>文件</th><th>状态</th><th>结果</th></tr></thead>
    <tbody>
      {% for job in jobs %}
      <tr>
        <td>{{ job.id }}</td>
        <td>{{ job.filename }}</td>
        <td>{{ job.status }}</td>
        <td><a href="/jobs/{{ job.id }}">查看</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>还没有任务。</p>
  {% endif %}
</section>
{% endblock %}
