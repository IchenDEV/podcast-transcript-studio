[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-transcript-studio"
version = "0.1.0"
description = "Local-first podcast transcription tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
]
worker = [
  "transformers>=4.51.0",
  "faster-whisper>=1.0",
  "huggingface_hub>=0.24",
  "pyannote.audio>=3.1",
  "opencc-python-reimplemented>=0.1.7",
  "torch",
  "torchaudio",
]
local-asr = [
  "qwen-asr>=0.1",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
podcast-transcript-studio = "podcast_transcript_studio.cli:main"

[tool.setuptools.packages.find]
include = [
  "podcast_transcript_studio*",
  "packages*",
  "podcast_web*",
]
